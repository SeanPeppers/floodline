[project]
name = "floodline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.18.2",
    "qiskit-ibm-runtime>=0.40",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
